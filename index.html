<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>수호의 영어 DT 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EC; --ink:#3B2F2A; --sub:#8A7A70;
  --c1:#FF7A59; --c2:#FFC23D; --c3:#4CC38A; --c4:#4AA8FF; --c5:#B07CFF;
  --card:#FFFFFF; --line:#F0E2CC; --ok:#2FB673; --bad:#FF5A5A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Fredoka',system-ui,sans-serif;overscroll-behavior:none}
.en{font-family:'Fredoka','Jua',system-ui,sans-serif;font-weight:500}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
#app{max-width:1200px;margin:0 auto;min-height:100%;padding:18px 22px 30px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:#fff;border:3px solid var(--line);border-radius:18px;font-size:26px;padding:8px 18px}
.title{font-size:30px;flex:1}
.stars{background:#fff;border:3px solid var(--c2);border-radius:999px;padding:8px 18px;font-size:24px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{border-radius:28px;padding:22px;text-align:left;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .1s;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tile .big{font-size:50px;line-height:1}
.tile .t{font-size:26px;margin-top:8px}
.tile .s{font-size:17px;opacity:.92}
.tile .prog{font-size:18px;margin-top:6px}
.hero{display:flex;align-items:center;gap:18px;background:#fff;border-radius:28px;padding:18px 24px;margin-bottom:18px;border:3px solid var(--line)}
.hero .face{font-size:64px}
.hero h1{margin:0;font-size:34px;font-weight:400}
.hero p{margin:4px 0 0;color:var(--sub);font-size:19px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
.tipbox{background:#FFF1C9;border:3px dashed var(--c2);border-radius:22px;padding:16px 20px;font-size:21px;line-height:1.5;margin:14px 0}
.card{background:var(--card);border-radius:30px;padding:24px 28px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.qrow{display:flex;align-items:center;gap:18px}
.pic{font-size:84px;line-height:1;min-width:100px;text-align:center}
.q{font-size:36px}
.spk{background:var(--c4);color:#fff;border-radius:50%;width:62px;height:62px;font-size:30px;flex:none;box-shadow:0 4px 0 #2F7FCC}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #2F7FCC}
.ans{font-size:38px;margin-top:22px;line-height:1.7;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.yn{font-size:34px;margin-right:4px}
.blank{display:inline-block;min-width:150px;border-bottom:5px solid var(--c1);text-align:center;color:var(--c1);padding:0 10px;border-radius:6px}
.blank.cur{background:#FFE6DE;animation:pulse 1.2s infinite}
.blank.done{color:var(--ok);border-color:var(--ok)}
.filled{color:var(--c1);background:#FFEDE6;border-radius:12px;padding:0 10px}
@keyframes pulse{50%{background:#FFD3C4}}
.choices{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px;justify-content:center}
.ch{background:#fff;border:4px solid var(--c4);border-radius:22px;font-size:34px;padding:14px 30px;min-width:170px;box-shadow:0 5px 0 #BBDDFF}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #BBDDFF}
.ch.wrong{border-color:var(--bad);animation:shake .4s;opacity:.45}
.ch.right{border-color:var(--ok);background:#DFF7EA}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.btn{border-radius:22px;font-size:26px;padding:14px 26px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:disabled{opacity:.35}
.b1{background:var(--c1)}.b2{background:var(--c2);color:#5a3d00}.b3{background:var(--c3)}.b4{background:var(--c4)}.b5{background:var(--c5)}.bg{background:#C9BBAE}
.counter{font-size:22px;color:var(--sub)}
.bar{height:16px;background:#F3E6D2;border-radius:99px;overflow:hidden;margin:2px 0 14px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:99px;transition:width .3s}
.msg{font-size:28px;text-align:center;min-height:40px;margin-top:10px}
/* writing */
.wrapcv{position:relative;margin-top:16px;background:#fff;border-radius:22px;border:3px solid var(--line);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;touch-action:none}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tg{background:#fff;border:3px solid var(--line);border-radius:14px;font-size:17px;padding:7px 10px;white-space:nowrap}
.tg.on{border-color:var(--c3);background:#E3F8EE}
.target{font-size:30px;color:var(--sub)}
/* result */
.center{text-align:center}
.bigstar{font-size:90px;letter-spacing:6px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;margin-top:10px}
.stk div{background:#fff;border:3px solid var(--line);border-radius:22px;font-size:60px;text-align:center;padding:14px 0}
.stk div.lock{filter:grayscale(1);opacity:.25}
.stk small{display:block;font-size:15px;color:var(--sub)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;top:-40px;font-size:34px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);font-size:64px;background:#fff;border-radius:30px;padding:20px 40px;border:5px solid var(--c2);z-index:60;animation:popin 1.1s forwards;pointer-events:none;white-space:nowrap}
@keyframes popin{15%{transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.wcard .pic{font-size:60px;min-width:80px}.wcard .q{font-size:32px}.wcard .spk{width:54px;height:54px;font-size:26px}
.zc{display:inline-flex;align-items:center;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden;font-size:20px}
.zc button{background:none;font-size:24px;padding:4px 14px}.zc span{min-width:62px;text-align:center;color:var(--sub);font-size:18px;cursor:pointer}
.hint{font-size:17px;color:var(--sub);margin-top:16px;line-height:1.5}
@media (max-width:800px){.modes{grid-template-columns:1fr}.q{font-size:28px}.ans{font-size:30px}.pic{font-size:64px;min-width:70px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
/* ===================== 시험지 내용 (DSB1 DT Preview) ===================== */
const UNITS = [
 {id:'like', color:'var(--c1)', emoji:'❄️', title:'Do you like ~?', ko:'좋아하니?', page:'DSB1 42~43p',
  tip:'💡 <b>You</b>로 물어보면 <b>I</b>로 대답해요.<br>💡 <b>he</b>로 물어보면 <b>he</b>로, <b>she</b>로 물어보면 <b>she</b>로!<br>💡 <b>Does</b>로 물어보면 <b>does / doesn\'t</b>로 대답해요.<br>예) Does she ~? → Yes, she does. / No, she doesn\'t.',
  pool:['snowboarding','summer','winter','swimming'],
  items:[
   {pic:'🏂',q:'Do you like snowboarding?',yn:'👍',a:'Yes, I do. I like {snowboarding}.'},
   {pic:'🏂',q:'Do you like snowboarding?',yn:'👎',a:"No, I don't. I don't like {snowboarding}."},
   {pic:'☀️',q:'Do you like summer?',yn:'👍',a:'Yes, I do. I like {summer}.'},
   {pic:'☀️',q:'Do you like summer?',yn:'👎',a:"No, I don't. I don't like {summer}."},
   {pic:'👦🏊',q:'Does he like swimming?',yn:'👍',a:'Yes, {he} {does}. He likes swimming.'},
   {pic:'👦🏊',q:'Does he like swimming?',yn:'👎',a:"No, {he} {doesn't}. He doesn't like swimming."},
   {pic:'👧🪁',q:'Does she like flying kites?',yn:'👍',a:'Yes, {she} {does}. She likes flying kites.'},
   {pic:'👧🪁',q:'Does she like flying kites?',yn:'👎',a:"No, {she} {doesn't}. She doesn't like flying kites."},
  ]},
 {id:'can', color:'var(--c4)', emoji:'🎹', title:'Can you play ~?', ko:'~할 수 있니?', page:'DSB1 90~91p',
  tip:'💡 Can you ~? = ~할 수 있니?<br>⭕ 할 수 있어: <b>Yes, I can.</b><br>❌ 할 수 없어: <b>No, I can\'t.</b>',
  pool:['tennis','piano'],
  items:[
   {pic:'🎾',q:'Can you play tennis?',yn:'👍',a:'Yes, I {can}. I can play tennis.'},
   {pic:'🎾',q:'Can you play tennis?',yn:'👎',a:"No, I {can't}. I can't play tennis."},
   {pic:'🎹',q:'Can you play the piano?',yn:'👍',a:'Yes, I {can}. I can play the piano.'},
   {pic:'🎹',q:'Can you play the piano?',yn:'👎',a:"No, I {can't}. I can't play the piano."},
  ]},
 {id:'much', color:'var(--c3)', emoji:'💰', title:'How much is it?', ko:'얼마예요?', page:'DSB2 42~43p',
  tip:'💡 지금 가격(세일 중인 가격): <b>How much is it? / How much are they?</b><br>💡 세일하기 전 가격: <b>How much was it? / How much were they?</b><br>🧸 하나면 is / was, 👢 두 개(짝)면 are / were',
  pool:['11','18','30','45'],
  items:[
   {pic:'🧸',tag:'18$ ➜ 11$',q:'I want a doll. How much is it?',a:"It's {11} dollars. It's on sale."},
   {pic:'🧸',tag:'18$ ➜ 11$',q:'How much was it?',a:'It {was} {18} dollars before.'},
   {pic:'👢',tag:'45$ ➜ 30$',q:'I want boots. How much are they?',a:"They're {30} dollars. It's on sale."},
   {pic:'👢',tag:'45$ ➜ 30$',q:'How much were they?',a:'They {were} {45} dollars before.'},
  ]},
 {id:'eat', color:'var(--c2)', emoji:'🍕', title:'What did you eat?', ko:'뭐 먹었니?', page:'DSB2 90~91p',
  tip:'💡 eat ➜ <b>ate</b> : 먹었다<br>💡 drink ➜ <b>drank</b> : 마셨다',
  pool:['salad','milk','pizza','water'],
  items:[
   {pic:'🥗',q:'What did you eat?',a:'I {ate} some {salad}.'},
   {pic:'🥛',q:'What did you drink?',a:'I {drank} some {milk}.'},
   {pic:'🍕',q:'What did you eat?',a:'I {ate} some {pizza}.'},
   {pic:'💧',q:'What did you drink?',a:'I {drank} some {water}.'},
  ]},
 {id:'doing', color:'var(--c5)', emoji:'🎮', title:'What are you doing?', ko:'뭐 하고 있니?', page:'DSB3 42~43p',
  tip:'💡 <b>~ing</b> : ~하는 중이에요.<br>💡 뒤에 오는 말을 보고 알맞은 행동 단어를 넣어요.<br>water ➜ drinking, sandwich ➜ eating, video games ➜ playing, medicine ➜ taking',
  pool:['drinking','eating','playing','taking','laughing','swimming'],
  items:[
   {pic:'🥤',q:'What are you doing?',a:'I am {drinking} water.'},
   {pic:'🥪',q:'What are you doing?',a:'I am {eating} a sandwich.'},
   {pic:'🎮',q:'What is she doing?',a:'She is {playing} video games.'},
   {pic:'💊',q:'What is she doing?',a:'She is {taking} medicine.'},
   {pic:'😂',q:'What is he doing?',a:'He is {laughing}.'},
   {pic:'🏊',q:'What are they doing?',a:'They are {swimming}.'},
  ]},
];
const ALT = {
  he:['she','I'], she:['he','I'], does:['do','is'], "doesn't":["don't","isn't"],
  can:["can't",'do'], "can't":['can',"don't"], was:['were','is'], were:['was','are'],
  ate:['eat','drank'], drank:['drink','ate']
};
const STICKERS=['🦖','🚀','🦄','🐯','🐬','🌈','🏆','🦁','🐼','🛸','🐙','👑','🍦','⚽','🦕','🐉','🎸','🌟','🦊','🎉'];
const PER_STICKER=10;
const PRAISE=['참 잘했어요! 🎉','최고야! 👍','멋져요! 🌟','대단해! 💪','완벽해! 🏆','Great job! 😆'];

/* ===================== 저장 (이 기기 브라우저에만) ===================== */
let S={stars:0,done:{}};
try{const r=localStorage.getItem('suho_dt');if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem('suho_dt',JSON.stringify(S));}catch(e){}}

/* ===================== 소리 ===================== */
let AC=null;
function tone(freqs,dur=.12,type='sine'){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      const t=AC.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.6);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur*1.8);});
  }catch(e){}
}
const ding=()=>tone([660,880,1320],.1,'triangle');
const boop=()=>tone([300,220],.14,'square');
const fanfare=()=>tone([523,659,784,1047,784,1047],.13,'triangle');
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/en[-_]US/i.test(x.lang)&&/female|samantha|google/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(text,rate=.82){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[{}]/g,''));u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}
}
function sayAll(arr){try{speechSynthesis.cancel();arr.forEach(t=>{const u=new SpeechSynthesisUtterance(t.replace(/[{}]/g,''));u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=.82;u.pitch=1.1;speechSynthesis.speak(u);});}catch(e){}}

/* ===================== 효과 ===================== */
function confetti(n=26){const fx=document.getElementById('fx');const set=['⭐','🎉','✨','🌟','🎈','💛'];
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='cf';s.textContent=set[i%set.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.5+'s';s.style.fontSize=(24+Math.random()*24)+'px';fx.appendChild(s);setTimeout(()=>s.remove(),2300);}}
function pop(t){const p=document.createElement('div');p.className='pop';p.textContent=t;document.body.appendChild(p);setTimeout(()=>p.remove(),1200);}
function addStar(n=1){const before=Math.floor(S.stars/PER_STICKER);S.stars+=n;save();
  const after=Math.floor(S.stars/PER_STICKER);
  if(after>before&&after<=STICKERS.length){setTimeout(()=>{fanfare();confetti(40);pop('새 스티커! '+STICKERS[after-1]);},700);}
  const el=document.getElementById('starcount');if(el)el.textContent=S.stars;}

/* ===================== 도우미 ===================== */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function parts(a){const out=[];a.split(/(\{[^}]+\})/).forEach(p=>{if(!p)return;if(p[0]==='{')out.push({blank:p.slice(1,-1)});else out.push({text:p});});return out;}
function blanksOf(a){return parts(a).filter(p=>p.blank).map(p=>p.blank);}
function plain(a){return a.replace(/[{}]/g,'');}
function choicesFor(word,unit){
  let alts=ALT[word]?ALT[word].slice():unit.pool.filter(w=>w!==word);
  alts=shuffle(alts).slice(0,2);
  return shuffle([word,...alts]);
}
let ZOOM_USER=null;try{const z=parseFloat(localStorage.getItem('suho_zoom'));if(z>0)ZOOM_USER=z;}catch(e){}
let Z=1;
function autoZoom(){return Math.max(.55,Math.min(1.25,Math.min(window.innerWidth/1200,window.innerHeight/780)));}
function applyZoom(){Z=ZOOM_USER||autoZoom();const a=document.getElementById('app');if(a)a.style.zoom=Z;const l=document.getElementById('zlabel');if(l)l.textContent=Math.round(Z*100)+'%';}
function zoomBy(d){ZOOM_USER=Math.max(.5,Math.min(1.5,Math.round(((ZOOM_USER||Z)+d)*100)/100));try{localStorage.setItem('suho_zoom',ZOOM_USER);}catch(e){}refit();}
function zoomAuto(){ZOOM_USER=null;try{localStorage.removeItem('suho_zoom');}catch(e){}refit();}
function refit(){applyZoom();if(cv&&document.body.contains(cv)){const keep=ink;setupCanvas();inkCtx.drawImage(keep,0,0,cv._W,cv._H);redraw();}}
function zoomCtl(){return `<span class="zc"><button onclick="zoomBy(-.05)">－</button><span id="zlabel" onclick="zoomAuto()" title="자동 맞춤">${Math.round(Z*100)}%</span><button onclick="zoomBy(.05)">＋</button></span>`;}
function topbar(title,back){
  return `<div class="top">${back?`<button class="back" onclick="${back}">◀ 뒤로</button>`:''}<div class="title">${title}</div>${zoomCtl()}<div class="stars">⭐ <span id="starcount">${S.stars}</span></div></div>`;
}
function qHTML(it){
  return `<div class="qrow"><div class="pic">${it.pic}</div><div style="flex:1"><div class="q en">${esc(it.q)}</div>${it.tag?`<div class="target en" style="margin-top:6px">🏷️ ${it.tag}</div>`:''}</div><button class="spk" onclick="say(CUR.q)">🔊</button></div>`;
}
let CUR=null;

/* ===================== 홈 ===================== */
function home(){
  speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();
  const st=Math.floor(S.stars/PER_STICKER);
  $('#app').innerHTML=topbar('수호의 영어 DT 대모험 🗺️')+
  `<div class="hero"><div class="face">🦖</div><div><h1>안녕, 수호야! 오늘도 영어 모험 떠나볼까?</h1><p>문제를 맞히면 ⭐을 받아요. ⭐ ${PER_STICKER}개마다 스티커가 하나씩 생겨요! (지금 스티커 ${Math.min(st,STICKERS.length)}개)</p></div></div>
  <div class="grid">`+
  UNITS.map((u,i)=>{const d=(S.done[u.id]||[]).length;return `<button class="tile" style="background:${u.color}" onclick="unitMenu(${i})"><div><div class="big">${u.emoji}</div><div class="t en">${u.title}</div><div class="s">${u.ko} · ${u.page}</div></div><div class="prog">⭐ ${d} / ${u.items.length}</div></button>`}).join('')+
  `<button class="tile" style="background:linear-gradient(135deg,#4AA8FF,#4CC38A)" onclick="vocabHome()"><div><div class="big">🔤</div><div class="t">단어 암기 (27개)</div><div class="s">영어 ➜ 한글, 한글 ➜ 영어 차근차근</div></div><div class="prog">🏅 단계별 5단계</div></button>
   <button class="tile" style="background:linear-gradient(135deg,#FF7A59,#B07CFF)" onclick="challenge(10)"><div><div class="big">🏆</div><div class="t">실전 DT 도전!</div><div class="s">랜덤 10문제 · 시험처럼 풀어보기</div></div><div class="prog">⭐ 보너스 별</div></button>
   <button class="tile" style="background:#7B6A5E" onclick="stickers()"><div><div class="big">📒</div><div class="t">스티커 북</div><div class="s">모은 스티커 구경하기</div></div><div class="prog">${Math.min(st,STICKERS.length)} / ${STICKERS.length}</div></button>
  </div>

let QZ=null;
function quiz(ui){
  const u=UNITS[ui];
  QZ={list:shuffle(u.items.map((it,k)=>({it,u,key:u.id+':'+k}))),idx:0,score:0,back:`unitMenu(${ui})`,title:'🧩 단어 고르기',challenge:false};

function challenge(n){
  let all=[];UNITS.forEach(u=>u.items.forEach((it,k)=>all.push({it,u,key:u.id+':'+k})));
  QZ={list:shuffle(all).slice(0,n),idx:0,score:0,back:'home()',title:'🏆 실전 DT 도전',challenge:true};
  qStep();
}
function qStep(){
  const {list,idx}=QZ; if(idx>=list.length)return qEnd();
  const {it,u}=list[idx];CUR=it;
  QZ.blanks=blanksOf(it.a);QZ.b=0;QZ.miss=false;
  $('#app').innerHTML=topbar(QZ.title,QZ.back)+
   `<div class="bar"><i style="width:${idx/list.length*100}%"></i></div>
   <div class="card">${qHTML(it)}<div class="ans en" id="ans"></div><div class="choices en" id="chs"></div></div>
   <div class="msg" id="msg">${it.yn==='👎'?'👎 "아니"라고 대답해요':it.yn==='👍'?'👍 "응"이라고 대답해요':'빈칸에 알맞은 단어를 골라요'}</div>
   <div class="nav"><span class="counter">${idx+1} / ${list.length} 문제</span><span class="counter">맞힌 문제 ⭐ ${QZ.score}</span></div>`;
  qRender();
  setTimeout(()=>say(it.q),250);
}
function qRender(){
  const it=CUR;let bi=0;
  $('#ans').innerHTML=(it.yn?`<span class="yn">${it.yn}</span>`:'')+'<span>'+parts(it.a).map(p=>{
    if(!p.blank)return esc(p.text);const i=bi++;
    if(i<QZ.b)return `<span class="blank done">${esc(p.blank)}</span>`;
    return `<span class="blank ${i===QZ.b?'cur':''}">&nbsp;</span>`;}).join('')+'</span>';
  if(QZ.b<QZ.blanks.length){
    const w=QZ.blanks[QZ.b];const ch=choicesFor(w,QZ.list[QZ.idx].u);
    $('#chs').innerHTML=ch.map(c=>`<button class="ch" data-w="${esc(c)}">${esc(c)}</button>`).join('');
    $('#chs').querySelectorAll('.ch').forEach(b=>b.onclick=()=>qPick(b));
  } else $('#chs').innerHTML='';
}
function qPick(b){
  const w=QZ.blanks[QZ.b];
  if(b.dataset.w===w){b.classList.add('right');ding();QZ.b++;
    setTimeout(()=>{qRender();if(QZ.b>=QZ.blanks.length)qDone();},350);
  } else {b.classList.add('wrong');boop();QZ.miss=true;$('#msg').textContent='앗, 다시 한 번 골라볼까? 🤔';}
}
function qDone(){
  const ok=!QZ.miss;const key=QZ.list[QZ.idx].key;
  if(ok){QZ.score++;addStar(QZ.challenge?2:1);markDone(key);confetti(18);}
  $('#msg').innerHTML=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]+(QZ.challenge?' ⭐+2':' ⭐+1'):'좋아요! 다음엔 한 번에 맞혀보자 💪';
  say(plain(CUR.a));
  $('#chs').innerHTML=`<button class="btn b4" onclick="QZ.idx++;qStep()">다음 문제 ▶</button>`;
}
function markDone(key){const [uid,k]=key.split(':');S.done[uid]=S.done[uid]||[];if(!S.done[uid].includes(+k))S.done[uid].push(+k);save();}
function qEnd(){
  const n=QZ.list.length,s=QZ.score,r=s/n;
  const stars=r>=.9?'⭐⭐⭐':r>=.6?'⭐⭐':'⭐';
  fanfare();confetti(50);
  $('#app').innerHTML=topbar(QZ.title,QZ.back)+
  `<div class="card center"><div class="bigstar">${stars}</div>
   <h1 style="font-size:44px;font-weight:400;margin:10px 0">${n}문제 중 ${s}문제를 한 번에 맞혔어요!</h1>
   <p style="font-size:26px;color:var(--sub)">${r>=.9?'DT 시험 준비 완벽! 🏆':r>=.6?'거의 다 왔어요! 한 번 더 하면 만점! 💪':'천천히 다시 해보면 금방 잘할 수 있어요 😊'}</p>
   <div class="nav" style="justify-content:center"><button class="btn b1" onclick="${QZ.challenge?'challenge('+n+')':'QZ.idx=0;QZ.score=0;QZ.list=shuffle(QZ.list);qStep()'}">🔁 다시 하기</button>
   ${QZ.challenge?`<button class="btn b5" onclick="challenge(26)">🔥 전체 26문제 도전</button>`:''}
   <button class="btn b4" onclick="home()">🏠 처음으로</button></div></div>`;
}

let PEN={penOnly:false,trace:true,color:'#3B2F2A',board:'light'};
try{const p=JSON.parse(localStorage.getItem('suho_pen')||'null');if(p)Object.assign(PEN,p);}catch(e){}
function savePen(){try{localStorage.setItem('suho_pen',JSON.stringify(PEN));}catch(e){}}
const PEN_COLORS=['#3B2F2A','#FFFFFF','#FF5A5A','#FF9F1C','#2FB673','#4AA8FF','#B07CFF','#FF6FB5'];
function colorBtns(){return '<span style="display:inline-flex;gap:5px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:16px;padding:4px 7px">'+PEN_COLORS.map(c=>`<button class="pc" data-c="${c}" style="width:32px;height:32px;border-radius:50%;background:${c};border:4px solid ${PEN.color===c?'#FFC23D':'#fff'};box-shadow:0 0 0 2px ${PEN.color===c?'#FFC23D':(c==='#FFFFFF'?'#999':'#eee')};transform:scale(${PEN.color===c?1.15:1})" onclick="setPenColor('${c}')"></button>`).join('')+'</span> <button class="tg" id="boardBtn" onclick="toggleBoard()">'+(PEN.board==='dark'?'⬛ 칠판':'⬜ 종이')+'</button>';}
function applyBoard(){const w=document.getElementById('wrap');if(w){w.style.background=PEN.board==='dark'?'#24352E':'#fff';w.style.borderColor=PEN.board==='dark'?'#8B6B4A':'';}const b=document.getElementById('boardBtn');if(b)b.textContent=PEN.board==='dark'?'⬛ 칠판':'⬜ 종이';if(typeof cv!=='undefined'&&cv&&document.body.contains(cv))redraw();}
function toggleBoard(){PEN.board=PEN.board==='dark'?'light':'dark';savePen();applyBoard();}
function setPenColor(c){PEN.color=c;if(c==='#FFFFFF'&&PEN.board!=='dark'){PEN.board='dark';applyBoard();}savePen();document.querySelectorAll('.pc').forEach(b=>{const on=b.dataset.c===c;b.style.borderColor=on?'#FFC23D':'#fff';b.style.boxShadow='0 0 0 2px '+(on?'#FFC23D':(b.dataset.c==='#FFFFFF'?'#999':'#eee'));b.style.transform='scale('+(on?1.15:1)+')';});}
let WR=null;
function writeSent(ui,k){

  WR={ui,k,target,checked:false};

  $('#app').innerHTML=topbar('✏️ 펜으로 써보기',`unitMenu(${ui})`)+
  `<div class="bar"><i style="width:${(k+1)/u.items.length*100}%"></i></div>
  <div class="card wcard" style="padding:12px 22px">${qHTML(it)}
   <div class="ans en" style="margin-top:4px;font-size:34px">${it.yn?`<span class="yn">${it.yn}</span>`:''}<span id="wans">${ans}</span></div></div>
  <div class="wrapcv" id="wrap"><canvas id="cv"></canvas></div>
  <div class="tools">
   <button class="tg ${PEN.trace?'on':''}" id="tTrace">👀 힌트 ${PEN.trace?'ON':'OFF'}</button>
   <button class="tg ${PEN.penOnly?'on':''}" id="tPen">${PEN.penOnly?'🖊️ 펜만':'✋ 손가락OK'}</button>
   ${colorBtns()}
   ${toolBtns()}
   <button class="tg" onclick="say(WR.target)">🔊</button>
  </div>
  <div class="msg" id="wmsg">${PEN.trace?'회색 점선을 따라 또박또박 써 보세요 ✍️':'빈칸에 들어갈 단어를 기억해서 써 보세요 🧠'}</div>
  <div class="nav"><button class="btn bg" ${k===0?'disabled':''} onclick="writeSent(${ui},${k-1})">◀ 이전</button>
   <span id="wbtns"><button class="btn b2" onclick="wCheck()">✅ 다 썼어요! 정답 확인</button></span>
   <button class="btn b4" onclick="${k<u.items.length-1?`writeSent(${ui},${k+1})`:`unitMenu(${ui})`}">${k<u.items.length-1?'다음 ▶':'끝! 🎉'}</button></div>`;
  $('#tTrace').onclick=()=>{PEN.trace=!PEN.trace;savePen();writeSent(ui,k);};
  $('#tPen').onclick=()=>{PEN.penOnly=!PEN.penOnly;savePen();writeSent(ui,k);};
  setupCanvas();
  setTimeout(()=>say(it.q),250);

let cv,ctx,ink,inkCtx,drawing=false,last=null;
function setupCanvas(){
  cv=$('#cv');const wrap=$('#wrap');const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth,H=Math.max(170,Math.min(300,window.innerHeight/Z*.26));const R=dpr*Z;
  cv.width=Math.round(W*R);cv.height=Math.round(H*R);cv.style.height=H+'px';
  ctx=cv.getContext('2d');ctx.scale(R,R);
  ink=document.createElement('canvas');ink.width=cv.width;ink.height=cv.height;inkCtx=ink.getContext('2d');inkCtx.scale(R,R);
  cv._W=W;cv._H=H;cv._dpr=dpr;
  applyBoard();
  TOOL='draw';UNDO=[];hoverPt=null;updToolBtns();
  cv.onpointerdown=e=>{
    if(PEN.penOnly&&e.pointerType!=='pen')return;
    e.preventDefault();cv.setPointerCapture(e.pointerId);
    pushUndo();
    // S펜 옆 버튼을 누른 채 쓰거나(펜 버튼) 지우개 모드면 지우기
    erasing=TOOL==='erase'||(e.pointerType==='pen'&&((e.buttons&2)||(e.buttons&32)));
    drawing=true;last=pt(e);dot(last);};
  cv.onpointermove=e=>{
    if(PEN.penOnly&&e.pointerType!=='pen')return;
    if(!drawing){if(TOOL==='erase'){hoverPt=pt(e);redraw();}return;}
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    evs.forEach(ev=>{const p=pt(ev);line(last,p);last=p;});hoverPt=last;redraw();};
  const end=()=>{drawing=false;last=null;erasing=false;};
  cv.onpointerup=end;cv.onpointercancel=end;
  cv.onpointerleave=()=>{end();hoverPt=null;redraw();};
}
let TOOL='draw',UNDO=[],erasing=false,hoverPt=null;
const ERASER_W=34;
function pushUndo(){try{UNDO.push(inkCtx.getImageData(0,0,ink.width,ink.height));if(UNDO.length>25)UNDO.shift();}catch(e){}updToolBtns();}
function undoCv(){const d=UNDO.pop();if(d){inkCtx.putImageData(d,0,0);redraw();}updToolBtns();}
function setTool(t){TOOL=t;hoverPt=null;updToolBtns();redraw();}
function updToolBtns(){
  const d=document.getElementById('tDraw'),e=document.getElementById('tErase'),u=document.getElementById('tUndo');
  if(d)d.classList.toggle('on',TOOL==='draw');if(e)e.classList.toggle('on',TOOL==='erase');
  if(u)u.style.opacity=UNDO.length?1:.4;
  if(cv)cv.style.cursor=TOOL==='erase'?'cell':'crosshair';
}
function toolBtns(){return `<span style="display:inline-flex;gap:6px;align-items:center">
  <button class="tg on" id="tDraw" onclick="setTool('draw')">✏️ 펜</button>
  <button class="tg" id="tErase" onclick="setTool('erase')">🧽 지우개</button>
  <button class="tg" id="tUndo" onclick="undoCv()" style="opacity:.4">↩️ 취소</button>
  <button class="tg" id="tClear">🗑️ 전부</button></span>`;}
let clearArm=false;
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('#tClear');if(!b)return;
  if(!clearArm){clearArm=true;b.textContent='한 번 더 누르면 전부 지워요';b.style.background='#FFE0E0';setTimeout(()=>{clearArm=false;if(b.isConnected){b.textContent='🗑️ 전부';b.style.background='';}},2500);return;}
  clearArm=false;b.textContent='🗑️ 전부';b.style.background='';pushUndo();clearCv();});
function pt(e){const r=cv.getBoundingClientRect();const sx=cv._W/r.width,sy=cv._H/r.height;const pr=e.pointerType==='pen'?(e.pressure||.5):.5;return {x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy,w:3+pr*7};}
function dot(p){
  if(erasing){inkCtx.save();inkCtx.globalCompositeOperation='destination-out';inkCtx.beginPath();inkCtx.arc(p.x,p.y,ERASER_W/2,0,Math.PI*2);inkCtx.fill();inkCtx.restore();redraw();return;}
  inkCtx.fillStyle=PEN.color;inkCtx.beginPath();inkCtx.arc(p.x,p.y,p.w/2,0,Math.PI*2);inkCtx.fill();redraw();}
function line(a,b){
  inkCtx.save();
  if(erasing){inkCtx.globalCompositeOperation='destination-out';inkCtx.strokeStyle='#000';inkCtx.lineWidth=ERASER_W;}
  else{inkCtx.strokeStyle=PEN.color;inkCtx.lineWidth=(a.w+b.w)/2;}
  inkCtx.lineCap='round';inkCtx.lineJoin='round';inkCtx.beginPath();inkCtx.moveTo(a.x,a.y);inkCtx.lineTo(b.x,b.y);inkCtx.stroke();inkCtx.restore();}
function clearCv(){inkCtx.clearRect(0,0,cv._W,cv._H);redraw();}
function fitFont(text,W,H){let fs=H*.42;ctx.font=`500 ${fs}px Fredoka, sans-serif`;while(ctx.measureText(text).width>W*.9&&fs>20){fs-=4;ctx.font=`500 ${fs}px Fredoka, sans-serif`;}return fs;}
function redraw(){
  const W=cv._W,H=cv._H;ctx.clearRect(0,0,W,H);
  // 영어 4선 노트
  const top=H*.18,mid=H*.40,base=H*.66,bot=H*.86;
  ctx.lineWidth=2;
  [[top,'#9DCBFF',[]],[mid,'#FFB3A0',[10,8]],[base,'#FF7A59',[]],[bot,'#9DCBFF',[]]].forEach(([y,c,d])=>{ctx.strokeStyle=c;ctx.setLineDash(d);ctx.beginPath();ctx.moveTo(14,y);ctx.lineTo(W-14,y);ctx.stroke();});
  ctx.setLineDash([]);
  const fs=fitFont(WR.target,W,H*1.05);ctx.textBaseline='alphabetic';
  const tw=ctx.measureText(WR.target).width;const tx=(W-tw)/2;
  if(PEN.trace&&!WR.checked){ctx.strokeStyle=PEN.board==='dark'?'rgba(255,255,255,.55)':'rgba(140,125,115,.55)';ctx.lineWidth=2.5;ctx.setLineDash([5,6]);ctx.strokeText(WR.target,tx,base);ctx.setLineDash([]);}
  ctx.drawImage(ink,0,0,W,H);
  if(WR.checked&&WR.showAns!==false){
    // 정답을 내 글씨 '위에' 테두리 글자로 겹쳐 보여주기 (안쪽이 비어 있어서 내 글씨도 보여요)
    ctx.save();ctx.lineJoin='round';
    ctx.strokeStyle=PEN.board==='dark'?'rgba(0,0,0,.85)':'rgba(255,255,255,.95)';ctx.lineWidth=8;ctx.strokeText(WR.target,tx,base);
    ctx.strokeStyle=PEN.board==='dark'?'#7CF0B0':'#13A35C';ctx.lineWidth=3;ctx.strokeText(WR.target,tx,base);
    ctx.restore();
  }
  if(hoverPt&&(TOOL==='erase'||erasing)){ctx.save();ctx.setLineDash([4,4]);ctx.lineWidth=2;ctx.strokeStyle=PEN.board==='dark'?'#fff':'#FF5A5A';ctx.beginPath();ctx.arc(hoverPt.x,hoverPt.y,ERASER_W/2,0,Math.PI*2);ctx.stroke();ctx.restore();}
}
function ansBanner(t){return `<div class="en" style="display:inline-block;font-size:40px;color:#13A35C;background:#E3F8EE;border:3px solid #4CC38A;border-radius:18px;padding:2px 26px;margin-bottom:4px">정답 ✔ ${esc(t)}</div>`;}
function ansToggleBtn(){return `<button class="tg" style="font-size:16px;padding:4px 10px" onclick="WR.showAns=WR.showAns===false;this.textContent=WR.showAns===false?'👁️ 정답 겹쳐보기':'🙈 내 글씨만 보기';redraw()">🙈 내 글씨만 보기</button>`;}
function wCheck(){
  WR.checked=true;WR.showAns=true;redraw();say(WR.target);
  let bi=0;$('#wans').innerHTML=parts(CUR.a).map(p=>p.blank?`<span class="blank done">${esc(p.blank)}</span>`:esc(p.text)).join('');
  $('#wmsg').innerHTML=ansBanner(WR.target)+'<div style="font-size:20px;color:var(--sub)">초록 테두리 글자 안에 내 글씨가 잘 들어갔나요? '+ansToggleBtn()+'</div>';
  $('#wbtns').innerHTML=`<button class="btn b3" onclick="wGood()">⭕ 맞게 썼어요!</button> <button class="btn b1" onclick="writeSent(WR.ui,WR.k)">🔁 다시 쓸래요</button>`;
}
function wGood(){
  addStar(1);markDone(UNITS[WR.ui].id+':'+WR.k);ding();confetti(22);say(plain(CUR.a));

/* ===================== 스티커 북 ===================== */
function stickers(){
  const have=Math.floor(S.stars/PER_STICKER);

S.vdone=S.vdone||{}; S.wrong=S.wrong||[];
const spellOut=en=>en.replace(/-/g,', ');
function sayKo(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[()]/g,' '));u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
function koFull(v){return v.ko+(v.past?` <span style="font-size:.6em;color:var(--sub)">(과거: ${v.past})</span>`:'');}
function enFull(v){const p=v.en.split('-');return p.length>1?`${p[0]} <span style="color:var(--sub)">➜</span> ${p[1]}`:v.en;}
function addWrong(i){if(!S.wrong.includes(i)){S.wrong.push(i);save();}}
function rmWrong(i){S.wrong=S.wrong.filter(x=>x!==i);save();}
function vgList(g){if(g==='wrong')return S.wrong.slice();const [a,b]=VGROUPS[g].range;return Array.from({length:b-a},(_,k)=>a+k);}
function vgName(g){return g==='wrong'?'❗ 틀린 단어 다시':VGROUPS[g].icon+' '+VGROUPS[g].name;}

function vocabHome(){

  <div class="grid">`+
  VGROUPS.map((g,i)=>{const n=VMODES.filter(m=>(S.vdone[i+':'+m.id])).length;const [a,b]=g.range;

function vocabGroup(g){

   return `<button class="tile" style="background:${['var(--c4)','var(--c3)','var(--c2)','var(--c1)','var(--c5)'][k]};${k===2?'color:#5a3d00':''}" onclick="vStart(${JSON.stringify(g)},'${m.id}')"><div><div class="big" style="font-size:40px">${m.icon}</div><div class="t">${k+1}단계 · ${m.name}</div><div class="s">${m.desc}</div></div><div class="prog">${done?'🏅 완료!':'도전!'}</div></button>`}).join('')+
  `</div>`;
}

let VZ=null;
function vStart(g,mode){
  let list=vgList(g); if(!list.length)return vocabHome();
  if(mode!=='card')list=shuffle(list);
  VZ={g,mode,list,idx:0,score:0,miss:false};
  vStep();
}
function vBar(){return `<div class="bar"><i style="width:${VZ.idx/VZ.list.length*100}%"></i></div>`;}
function vNav(extra=''){return `<div class="nav"><span class="counter">${VZ.idx+1} / ${VZ.list.length}</span>${extra}<span class="counter">⭐ ${VZ.score}</span></div>`;}
function vTitle(){const m=VMODES.find(x=>x.id===VZ.mode);return `${m.icon} ${m.name}`;}
function vStep(){
  if(VZ.idx>=VZ.list.length)return vEnd();
  VZ.miss=false;const v=VOCAB[VZ.list[VZ.idx]];
  ({card:vCard,ek:vEK,ke:vKE,sp:vSP,wr:vWR})[VZ.mode](v);
}
function vNext(){VZ.idx++;vStep();}
function vRight(i){if(!VZ.miss){VZ.score++;addStar(1);if(VZ.g==='wrong')rmWrong(i);}}

/* 1단계: 카드 */
function vCard(v){
  $('#app').innerHTML=topbar(vTitle(),`vocabGroup(${JSON.stringify(VZ.g)})`)+vBar()+

/* 보기 만들기: 뜻이 같은 단어(foolish/silly)는 보기에서 빼기 */
function vChoices(i,n=4){
  const v=VOCAB[i];
  const pool=shuffle(VOCAB.map((_,k)=>k).filter(k=>k!==i&&VOCAB[k].en!==v.same&&VOCAB[k].ko!==v.ko));
  return shuffle([i,...pool.slice(0,n-1)]);
}

    <div style="font-size:50px;display:flex;align-items:center;justify-content:center;gap:16px">${koFull(v)} <button class="spk" onclick="sayKo(VOCAB[${i}].ko)">🔊</button></div>

function vBind(i,onRight){
  $('#chs').querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
    if(VZ.locked)return;
    if(+b.dataset.k===i){b.classList.add('right');ding();vRight(i);onRight();VZ.locked=true;
      $('#msg').innerHTML=VZ.miss?'좋아요! 이 단어는 꼭 기억하자 💪':PRAISE[Math.floor(Math.random()*PRAISE.length)]+' ⭐+1';
      if(!VZ.miss)confetti(14);
      setTimeout(()=>{VZ.locked=false;vNext();},1500);
    }else{b.classList.add('wrong');boop();if(!VZ.miss){VZ.miss=true;addWrong(i);}$('#msg').textContent='앗, 다시 골라볼까? 🤔';}
  });
}
/* 4단계: 철자 맞추기 */
function vSP(v){
  const i=VZ.list[VZ.idx];const chars=[...v.en];
  VZ.pos=0;while(VZ.pos<chars.length&&!/[a-z]/i.test(chars[VZ.pos]))VZ.pos++;
  const letters=shuffle(chars.map((c,k)=>({c,k})).filter(o=>/[a-z]/i.test(o.c)));
  const slotW=chars.length>14?40:chars.length>9?50:60;
  $('#app').innerHTML=topbar(vTitle(),`vocabGroup(${JSON.stringify(VZ.g)})`)+vBar()+
  `<div class="card center"><div style="font-size:70px">${v.pic}</div>
   <div style="font-size:44px;display:flex;align-items:center;justify-content:center;gap:16px">${koFull(v)} <button class="spk" onclick="say(spellOut('${v.en}'))">🔊</button></div>
   <div id="slots" class="en" style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:20px">${chars.map((c,k)=>/[a-z]/i.test(c)?`<span data-s="${k}" style="width:${slotW}px;height:${slotW+14}px;border-bottom:5px solid var(--c1);font-size:${slotW*.75}px;display:inline-flex;align-items:center;justify-content:center;color:var(--ok)"></span>`:`<span style="width:${c===' '?slotW/1.5:slotW/1.5}px;font-size:${slotW*.75}px;display:inline-flex;align-items:center;justify-content:center">${c===' '?'':'➜'}</span>`).join('')}</div>
   <div id="tiles" class="choices en" style="gap:10px">${letters.map(o=>`<button class="ch" style="min-width:0;width:72px;padding:12px 0;font-size:36px;border-color:var(--c2);box-shadow:0 5px 0 #FFE29A" data-c="${o.c}">${o.c}</button>`).join('')}</div>
  </div><div class="msg" id="msg"><button class="tg" onclick="vHint()">💡 힌트 (다음 글자 알려줘)</button></div>`+vNav();
  $('#tiles').querySelectorAll('.ch').forEach(b=>b.onclick=()=>vTile(b,v,i));
  setTimeout(()=>sayKo(v.ko),250);
}
function vHint(){const v=VOCAB[VZ.list[VZ.idx]];const need=v.en[VZ.pos];if(!VZ.miss){VZ.miss=true;addWrong(VZ.list[VZ.idx]);}
  const t=[...document.querySelectorAll('#tiles .ch')].find(b=>b.style.visibility!=='hidden'&&b.dataset.c===need);if(t){t.style.background='#FFF1C9';t.style.transform='scale(1.15)';setTimeout(()=>{t.style.transform='';},600);}say(need);}
function vTile(b,v,i){
  const chars=[...v.en];
  if(b.dataset.c===chars[VZ.pos]){
    tone([700+VZ.pos*30],.07,'triangle');
    document.querySelector(`[data-s="${VZ.pos}"]`).textContent=b.dataset.c;b.style.visibility='hidden';
    VZ.pos++;while(VZ.pos<chars.length&&!/[a-z]/i.test(chars[VZ.pos]))VZ.pos++;
    if(VZ.pos>=chars.length){ding();vRight(i);say(spellOut(v.en));if(!VZ.miss)confetti(16);
      $('#msg').innerHTML=(VZ.miss?'완성! 다음엔 힌트 없이 해보자 💪':PRAISE[Math.floor(Math.random()*PRAISE.length)]+' ⭐+1')+` <button class="btn b4" onclick="vNext()">다음 ▶</button>`;}
  }else{b.classList.add('wrong');boop();setTimeout(()=>b.classList.remove('wrong'),450);
    if(!VZ.miss){VZ.miss=true;addWrong(i);}}
}
/* 5단계: 펜으로 쓰기 (따라쓰기 캔버스 재사용) */
function vWR(v){

  $('#app').innerHTML=topbar(vTitle(),`vocabGroup(${JSON.stringify(VZ.g)})`)+vBar()+
  `<div class="card" style="padding:16px 24px"><div class="qrow"><div class="pic" style="font-size:64px">${v.pic}</div><div style="flex:1;font-size:40px">${koFull(v)}</div><button class="spk" onclick="sayKo(VOCAB[${i}].ko)">🔊</button></div></div>

  <div class="nav"><span class="counter">${VZ.idx+1} / ${VZ.list.length}</span>
   <span id="wbtns"><button class="btn b2" onclick="vWCheck(${i})">✅ 다 썼어요! 정답 확인</button></span>
   <button class="btn bg" onclick="vNext()">건너뛰기 ▶</button></div>`;
  $('#tTrace').onclick=()=>{PEN.trace=!PEN.trace;savePen();vWR(v);};
  $('#tPen').onclick=()=>{PEN.penOnly=!PEN.penOnly;savePen();vWR(v);};
  setupCanvas();
  setTimeout(()=>sayKo(v.ko),250);
}
function vWCheck(i){
  WR.checked=true;WR.showAns=true;redraw();say(spellOut(VOCAB[i].en));
  $('#wmsg').innerHTML=ansBanner(VOCAB[i].en.replace('-',' ➜ '))+'<div style="font-size:20px;color:var(--sub)">초록 테두리 글자 안에 내 글씨가 잘 들어갔나요? '+ansToggleBtn()+'</div>';
  $('#wbtns').innerHTML=`<button class="btn b3" id="wOk">⭕ 맞게 썼어요!</button> <button class="btn b1" id="wNo">❌ 틀렸어요</button>`;
  $('#wOk').onclick=()=>{vRight(i);ding();confetti(18);$('#wbtns').innerHTML='';$('#wmsg').innerHTML=PRAISE[Math.floor(Math.random()*PRAISE.length)]+' ⭐+1';setTimeout(vNext,1300);};
  $('#wNo').onclick=()=>{addWrong(i);VZ.miss=true;$('#wmsg').innerHTML='괜찮아요! 한 번 더 따라 써 봐요 ✍️';clearCv();WR.checked=false;PEN.trace=true;vWR(VOCAB[i]);VZ.miss=true;};
}
function vEnd(){
  const n=VZ.list.length,s=VZ.score;
  if(VZ.g!=='wrong'&&(VZ.mode==='card'||s/n>=.8)){S.vdone[VZ.g+':'+VZ.mode]=1;save();}

  const mi=VMODES.findIndex(m=>m.id===VZ.mode);const nextM=VMODES[mi+1];
  const msg=VZ.mode==='card'?`카드 ${n}장을 모두 봤어요! 이제 문제로 확인해 볼까요?`:`${n}개 중 ${s}개를 한 번에 맞혔어요!`;

  `<div class="card center"><div class="bigstar">${VZ.mode==='card'?'🏅':s/n>=.9?'⭐⭐⭐':s/n>=.6?'⭐⭐':'⭐'}</div>
   <h1 style="font-size:40px;font-weight:400;margin:10px 0">${msg}</h1>
